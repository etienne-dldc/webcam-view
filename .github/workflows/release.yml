name: Release

# Build WebcamView.app and attach it to a GitHub Release whenever a tag
# matching v* is pushed, e.g.:
#   git tag v1.0.0 && git push --tags
#
# Uses the standard macOS 26 runner (Apple Silicon / arm64), so the artifact
# is the same native build you get on an M-series Mac.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Package zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent \
            WebcamView.app "WebcamView-${{ github.ref_name }}-macos-arm64.zip"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/WebcamView-${{ github.ref_name }}-macos-arm64.zip" \
            --title "WebcamView ${{ github.ref_name }}" \
            --notes "Auto-built from tag $GITHUB_REF_NAME on macOS 26 (arm64)."
